<!-- CHRVA Roster Generator (SportsEngine Custom Element) -->

<!-- Loading Spinner + Status -->
<div id="rg_status_wrap" style="margin: 0 0 12px 0;">
  <div id="rg_loading" style="display:none; justify-content:center; align-items:center; height:90px; flex-direction:column;">
    <div class="rg_spinner" style="
      border: 6px solid #f3f3f3;
      border-top: 6px solid #0052a5;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: rg_spin 1s linear infinite;
    "></div>
    <div style="margin-top:10px; font-weight:bold; color:#0052a5;">Generating roster PDF...</div>
  </div>

  <div id="rg_msg" style="
    display:none;
    margin: 8px 0 0 0;
    padding: 10px 12px;
    border-left: 4px solid #0052a5;
    background:#f0f4f9;
    font-size: 0.95em;
    color:#0f2a44;
  "></div>
</div>

<div style="max-width: 900px; margin: 0 auto;">
  <div style="
    border: 1px solid #e3e8ef;
    border-radius: 10px;
    padding: 16px;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  ">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <h2 style="margin:0; color:#a0001e; font-size: 1.35em;">Roster Generator</h2>
      <div style="font-size:0.95em; color:#0f2a44;">
        Powered by CHRVA Sheets → PDF
      </div>
    </div>

    <hr style="border:none; border-top:1px solid #e3e8ef; margin:14px 0;">

    <!-- Mode -->
    <label style="display:block; font-weight:700; color:#0f2a44; margin-bottom:6px;">Mode</label>
    <select id="rg_mode" style="
      width:100%;
      padding: 10px 12px;
      border:1px solid #cfd8e3;
      border-radius:8px;

      font-size: 16px;      /* prevents iOS zoom & helps readability */
      line-height: 1.3;     /* key: avoid vertical clipping */
      min-height: 48px;     /* key: forces enough vertical space */
      height: 48px;         /* some browsers need explicit height */
      box-sizing: border-box;

      display: block;
    ">
      <option value="team" selected>Team roster (from Teams + Players + Staff tabs)</option>
      <option value="one-day">One-Day roster (manual player list)</option>
    </select>

    <!-- TEAM MODE -->
    <div id="rg_team_section" style="margin-top:14px;">
      <label style="display:block; font-weight:700; color:#0f2a44; margin-bottom:6px;">Team Name(s)</label>
      <input id="rg_team_name" type="text" placeholder="e.g. Dat Ace Doe, Tips & Guac, Spyke X Family"
        style="width:100%; padding:10px; border:1px solid #cfd8e3; border-radius:8px;" />

      <!-- ZIP toggle (used when multiple teams are entered) -->
      <label style="display:flex; gap:10px; align-items:center; margin-top:10px; color:#0f2a44;">
        <input type="checkbox" id="rg_zip" checked />
        Download as a single ZIP when multiple teams are entered
      </label>

      <label style="display:block; font-weight:700; color:#0f2a44; margin:12px 0 6px;">Borrowed Players (optional)</label>
      <textarea id="rg_borrowed" placeholder="Comma-separated names, e.g. John Doe, Jane Smith"
        style="width:100%; min-height:90px; padding:10px; border:1px solid #cfd8e3; border-radius:8px;"></textarea>

      <div style="margin-top:8px; font-size:0.92em; color:#445b76;">
        Tip: Use official names from the Players tab for best results.
      </div>
    </div>

    <!-- ONE-DAY MODE -->
    <div id="rg_oneday_section" style="display:none; margin-top:14px;">
      <label style="display:block; font-weight:700; color:#0f2a44; margin-bottom:6px;">One-Day Team Name</label>
      <input id="rg_oneday_name" type="text" placeholder="e.g. Frostbite Fill-Ins"
        style="width:100%; padding:10px; border:1px solid #cfd8e3; border-radius:8px;" />

      <label style="display:block; font-weight:700; color:#0f2a44; margin:12px 0 6px;">Players (comma-separated)</label>
      <textarea id="rg_oneday_players" placeholder="e.g. John Doe, Jane Smith, Ciobotaru, Ayal"
        style="width:100%; min-height:110px; padding:10px; border:1px solid #cfd8e3; border-radius:8px;"></textarea>
    </div>

    <button id="rg_generate" style="
      margin-top: 14px;
      width:100%;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: #0052a5;
      color: #fff;
      font-weight: 800;
      font-size: 1.02em;
      cursor: pointer;
    ">Generate PDF</button>

    <div style="margin-top:10px; font-size:0.9em; color:#556b85;">
      If the download doesn’t start, your browser may be blocking pop-ups/downloads for this page.
    </div>
  </div>
</div>

<style>
@keyframes rg_spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
#rg_generate:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
#rg_mode {
  line-height: 1.3 !important;
  min-height: 48px !important;
  height: 48px !important;
  padding-top: 10px !important;
  padding-bottom: 10px !important;
}
#rg_mode option {
  font-size: 16px !important;
}
</style>

<script>
  // ====== CONFIG ======
  const ROSTER_ENDPOINT = "https://chrva-proxy.vercel.app/api/roster";    // single PDF
  const ROSTERS_ZIP_ENDPOINT = "https://chrva-proxy.vercel.app/api/rosters"; // ZIP of multiple PDFs

  // ====== DOM ======
  const modeEl = document.getElementById("rg_mode");
  const teamSection = document.getElementById("rg_team_section");
  const onedaySection = document.getElementById("rg_oneday_section");

  const teamNameEl = document.getElementById("rg_team_name");
  const borrowedEl = document.getElementById("rg_borrowed");

  const onedayNameEl = document.getElementById("rg_oneday_name");
  const onedayPlayersEl = document.getElementById("rg_oneday_players");

  const zipEl = document.getElementById("rg_zip");

  const btn = document.getElementById("rg_generate");
  const loading = document.getElementById("rg_loading");
  const msg = document.getElementById("rg_msg");

  function showMsg(html, isError=false) {
    msg.style.display = "block";
    msg.style.borderLeftColor = isError ? "#a0001e" : "#0052a5";
    msg.style.background = isError ? "#fff0f2" : "#f0f4f9";
    msg.style.color = isError ? "#7a0016" : "#0f2a44";
    msg.innerHTML = html;
  }

  function clearMsg() {
    msg.style.display = "none";
    msg.innerHTML = "";
  }

  function setBusy(isBusy) {
    btn.disabled = isBusy;
    loading.style.display = isBusy ? "flex" : "none";
  }

  function safeFileName(name) {
    return (name || "Roster")
      .toString()
      .trim()
      .replace(/[^\w\s-]/g, "")
      .replace(/\s+/g, "_");
  }

  function parseTeams(raw) {
    return (raw || "")
      .split(",")
      .map(s => s.trim())
      .filter(Boolean)
      .filter((v, i, arr) => arr.indexOf(v) === i);
  }

  // Toggle sections by mode
  modeEl.addEventListener("change", () => {
    clearMsg();
    const mode = modeEl.value;
    if (mode === "team") {
      teamSection.style.display = "block";
      onedaySection.style.display = "none";
    } else {
      teamSection.style.display = "none";
      onedaySection.style.display = "block";
    }
  });

  // Trigger file download from blob
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  btn.addEventListener("click", async () => {
    clearMsg();

    const mode = modeEl.value;

    // Build payload + select endpoint
    let payload = {};
    let displayName = "";
    let endpoint = ROSTER_ENDPOINT;

    if (mode === "team") {
      const rawTeam = (teamNameEl.value || "").trim();
      const borrowed = (borrowedEl.value || "").trim();
      const teams = parseTeams(rawTeam);

      if (!teams.length) {
        showMsg("<strong>Please enter at least one Team Name.</strong>", true);
        return;
      }

      const zipChecked = zipEl ? zipEl.checked : true;

      // Multiple teams + zip enabled => ZIP endpoint
      if (teams.length > 1 && zipChecked) {
        payload = { mode: "team", team_names: teams };
        if (borrowed) payload.borrowed = borrowed;

        displayName = "Rosters";
        endpoint = ROSTERS_ZIP_ENDPOINT;

      } else {
        // Single team (or zip disabled) => single PDF endpoint
        payload = { mode: "team", team_name: teams[0] };
        if (borrowed) payload.borrowed = borrowed;

        displayName = teams[0];
        endpoint = ROSTER_ENDPOINT;
      }

    } else {
      // one-day mode (single PDF only)
      const oneDayName = (onedayNameEl.value || "").trim() || "One-Day Team";
      const players = (onedayPlayersEl.value || "").trim();

      // NOTE: borrowed players input lives in team section UI.
      // If you want borrowed in one-day mode too, move the textarea outside sections.
      const borrowed = (borrowedEl.value || "").trim();

      if (!players) {
        showMsg("<strong>Please enter at least one player name.</strong>", true);
        return;
      }

      payload = { mode: "one-day", team_name: oneDayName, players: players };
      if (borrowed) payload.borrowed = borrowed;

      displayName = oneDayName;
      endpoint = ROSTER_ENDPOINT;
    }

    setBusy(true);
    showMsg("Contacting roster service…");

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        let errText = await res.text();
        try {
          const j = JSON.parse(errText);
          errText = j.error || errText;
        } catch (e) {}
        throw new Error(errText || "Request failed");
      }

      const blob = await res.blob();

      // Determine filename
      const ct = (res.headers.get("content-type") || "").toLowerCase();
      const isZip = ct.includes("zip");

      const cd = res.headers.get("content-disposition") || "";
      const match = cd.match(/filename="([^"]+)"/i);

      const filename = match
        ? match[1]
        : (isZip ? "Rosters.zip" : (safeFileName(displayName) + "_Roster.pdf"));

      showMsg(`<strong>Success!</strong> Your file should download automatically.`);
      downloadBlob(blob, filename);

    } catch (err) {
      console.error(err);
      showMsg(`<strong>Failed to generate roster.</strong><br>${(err && err.message) ? err.message : err}`, true);
    } finally {
      setBusy(false);
    }
  });
</script>
