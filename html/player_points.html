<div class="chrva-player-points" data-player-points data-api-url="https://chrva-proxy.vercel.app/api/player-points">
  <h2>RevCo Standings for 2026-2027 Season - Sample Data</h2>

  <div class="chrva-player-points__controls" aria-label="Standings controls">
    <div class="chrva-player-points__gender" aria-label="Gender standings filters">
      <button type="button" class="is-active" data-gender-filter="M">Men</button>
      <button type="button" data-gender-filter="F">Women</button>
    </div>
    <label class="chrva-player-points__season">
      <span>Season</span>
      <select data-season-filter>
        <option value="2026">2026</option>
        <option value="2027">2027</option>
      </select>
    </label>
    <label class="chrva-player-points__search">
      <span>Search</span>
      <input type="search" data-player-search placeholder="Player name">
    </label>
  </div>

  <div class="chrva-player-points__status" data-status>Loading player points...</div>

  <div class="chrva-player-points__table-wrap" data-table-wrap hidden>
    <table class="chrva-player-points__table">
      <thead>
        <tr>
          <th>Player</th>
          <th>Points Earned</th>
          <th>Top 2 Finishes</th>
          <th>4s Tournaments Played</th>
        </tr>
      </thead>
      <tbody data-player-rows></tbody>
    </table>
    <div class="chrva-player-points__count" data-count></div>
  </div>
</div>

<style>
  .chrva-player-points {
    --chrva-red: #b51b2b;
    --chrva-red-dark: #941523;
    --chrva-row: #e9e9e9;
    --chrva-row-alt: #f4f4f4;
    --chrva-line: #ffffff;
    --chrva-text: #48576a;
    color: var(--chrva-text);
    font-family: Arial, Helvetica, sans-serif;
    margin: 0 auto;
    width: 100%;
  }

  .chrva-player-points * {
    box-sizing: border-box;
  }

  .chrva-player-points h2 {
    color: var(--chrva-red-dark);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    font-variant-numeric: lining-nums;
    font-feature-settings: "lnum" 1;
    font-weight: 900;
    line-height: 1.1;
    margin: 0 0 4px;
    text-transform: uppercase;
  }

  .chrva-player-points__controls {
    align-items: end;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    margin: 0 0 8px;
  }

  .chrva-player-points__gender {
    display: flex;
    gap: 8px;
  }

  .chrva-player-points__controls button {
    background: #fff;
    border: 1px solid var(--chrva-red);
    color: var(--chrva-red-dark);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    min-height: 34px;
    padding: 7px 14px;
    text-transform: uppercase;
  }

  .chrva-player-points__controls button:hover,
  .chrva-player-points__controls button:focus,
  .chrva-player-points__controls button.is-active {
    background: var(--chrva-red);
    color: #fff;
    outline: 0;
  }

  .chrva-player-points__season,
  .chrva-player-points__search {
    align-items: center;
    display: flex;
    gap: 8px;
    margin: 0;
  }

  .chrva-player-points__season span,
  .chrva-player-points__search span {
    color: var(--chrva-red-dark);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .chrva-player-points__season select,
  .chrva-player-points__search input {
    border: 1px solid #c7c7c7;
    color: var(--chrva-text);
    font: inherit;
    font-size: 13px;
    min-height: 34px;
    padding: 7px 10px;
  }

  .chrva-player-points__season select {
    min-width: 96px;
  }

  .chrva-player-points__search input {
    width: 220px;
  }

  .chrva-player-points__season select:focus,
  .chrva-player-points__search input:focus {
    border-color: var(--chrva-red);
    outline: 1px solid var(--chrva-red);
  }

  .chrva-player-points__status {
    background: var(--chrva-row);
    color: var(--chrva-text);
    font-size: 13px;
    font-weight: 700;
    padding: 12px 14px;
  }

  .chrva-player-points__table-wrap {
    overflow-x: auto;
  }

  .chrva-player-points__table {
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12px;
    width: 100%;
  }

  .chrva-player-points__table th {
    background: var(--chrva-red);
    border-right: 2px solid var(--chrva-line);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    font-variant-numeric: lining-nums;
    font-feature-settings: "lnum" 1;
    font-weight: 900;
    letter-spacing: 0;
    padding: 9px 14px;
    text-align: left;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .chrva-player-points__table th:nth-child(2),
  .chrva-player-points__table th:nth-child(3),
  .chrva-player-points__table th:nth-child(4) {
    text-align: center;
  }

  .chrva-player-points__table td {
    background: var(--chrva-row);
    border-bottom: 2px solid var(--chrva-line);
    border-right: 2px solid var(--chrva-line);
    padding: 9px 14px;
    vertical-align: top;
  }

  .chrva-player-points__player-row:nth-of-type(4n + 3) td {
    background: var(--chrva-row-alt);
  }

  .chrva-player-points__player-row {
    cursor: pointer;
  }

  .chrva-player-points__player-row:hover td,
  .chrva-player-points__player-row:focus td {
    background: #dddddd;
    outline: 0;
  }

  .chrva-player-points__name {
    font-weight: 700;
  }

  .chrva-player-points__points,
  .chrva-player-points__played {
    font-weight: 700;
    text-align: center;
    white-space: nowrap;
  }

  .chrva-player-points__top-results {
    display: grid;
    gap: 3px;
  }

  .chrva-player-points__top-result {
    line-height: 1.35;
  }

  .chrva-player-points__toggle {
    color: var(--chrva-red-dark);
    display: block;
    font-size: 11px;
    font-weight: 800;
    margin-top: 2px;
    text-align: center;
    text-transform: uppercase;
  }

  .chrva-player-points__details-row[hidden] {
    display: none;
  }

  .chrva-player-points__details-cell {
    background: #fff !important;
    padding: 0 0 8px !important;
  }

  .chrva-player-points__details {
    border: 1px solid #d7d7d7;
  }

  .chrva-player-points__details table {
    border-collapse: collapse;
    font-size: 12px;
    width: 100%;
  }

  .chrva-player-points__details th {
    background: #cfcfcf;
    color: #333;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    padding: 8px 10px;
  }

  .chrva-player-points__details td {
    background: #fff;
    border: 1px solid #e5e5e5;
    padding: 8px 10px;
  }

  .chrva-player-points__count {
    color: var(--chrva-text);
    font-size: 12px;
    font-weight: 700;
    margin-top: 6px;
    text-align: right;
  }

  @media (max-width: 760px) {
    .chrva-player-points h2 {
      font-size: 24px;
    }

    .chrva-player-points__table {
      min-width: 760px;
    }
  }
</style>

<script>
  (function () {
    var root = document.querySelector("[data-player-points]");
    if (!root) return;

    var apiUrl = root.getAttribute("data-api-url") || "https://chrva-proxy.vercel.app/api/player-points";
    var statusEl = root.querySelector("[data-status]");
    var tableWrap = root.querySelector("[data-table-wrap]");
    var rowsEl = root.querySelector("[data-player-rows]");
    var countEl = root.querySelector("[data-count]");
    var searchInput = root.querySelector("[data-player-search]");
    var seasonSelect = root.querySelector("[data-season-filter]");
    var filterButtons = Array.prototype.slice.call(root.querySelectorAll("[data-gender-filter]"));
    var expanded = {};
    var allPlayers = [];
    var selectedGender = "M";
    var selectedSeason = seasonSelect ? seasonSelect.value : "2026";
    var searchTerm = "";
    var maxVisiblePlayers = 10;

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) return "TBD";
      var date = new Date(value + "T00:00:00");
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function normalizePlayers(payload) {
      if (Array.isArray(payload)) return payload;
      if (Array.isArray(payload.players)) return payload.players;
      if (payload && payload.usavMemberId) return [payload];
      return [];
    }

    function genderLabel(value) {
      return value === "F" ? "Women" : "Men";
    }

    function topResults(player) {
      return (player.results || [])
        .slice()
        .sort(function (a, b) {
          return Number(b.points || 0) - Number(a.points || 0) || String(a.date || "").localeCompare(String(b.date || ""));
        })
        .slice(0, 2);
    }

    function resultLine(result) {
      var bracket = result.bracket ? escapeHtml(result.bracket) + " " : "";
      var finish = result.finish ? " - " + bracket + escapeHtml(result.finish) : "";
      return "<div class=\"chrva-player-points__top-result\"><strong>" +
        escapeHtml(result.name || "Tournament") + "</strong>: " +
        escapeHtml(result.points || 0) + " pts" + finish + "</div>";
    }

    function playerRow(player) {
      var id = escapeHtml(player.usavMemberId);
      var isExpanded = !!expanded[player.usavMemberId];
      var top = topResults(player);
      var topHtml = top.length ? top.map(resultLine).join("") : "No finishes listed";

      return "<tr class=\"chrva-player-points__player-row\" tabindex=\"0\" role=\"button\" aria-expanded=\"" + isExpanded + "\" data-player-id=\"" + id + "\">" +
        "<td><div class=\"chrva-player-points__name\">" + escapeHtml(player.name || "Unknown Player") + "</div></td>" +
        "<td class=\"chrva-player-points__points\">" + escapeHtml(player.totalPoints || 0) + "</td>" +
        "<td><div class=\"chrva-player-points__top-results\">" + topHtml + "</div></td>" +
        "<td class=\"chrva-player-points__played\">" + escapeHtml(player.tournamentsPlayed || 0) +
        "<span class=\"chrva-player-points__toggle\">" + (isExpanded ? "Hide Details" : "View Details") + "</span></td>" +
        "</tr>" +
        "<tr class=\"chrva-player-points__details-row\" " + (isExpanded ? "" : "hidden") + " data-details-for=\"" + id + "\">" +
        "<td class=\"chrva-player-points__details-cell\" colspan=\"4\">" + detailsTable(player.results || []) + "</td>" +
        "</tr>";
    }

    function teamText(team) {
      if (!team || (!team.name && !(team.players || []).length)) return "-";
      var playerNames = (team.players || []).map(function (player) {
        return player.name || player.usavMemberId;
      }).filter(Boolean).join(", ");
      if (team.name && playerNames) return team.name + ": " + playerNames;
      return team.name || playerNames || "-";
    }

    function detailsTable(results) {
      if (!results.length) {
        return "<div class=\"chrva-player-points__status\">No tournament results listed.</div>";
      }

      return "<div class=\"chrva-player-points__details\"><table>" +
        "<thead><tr><th>Date</th><th>Tournament</th><th>Team</th><th>Bracket</th><th>Points</th><th>Finish</th><th>Total Teams</th></tr></thead>" +
        "<tbody>" + results.map(function (result) {
          return "<tr>" +
            "<td>" + escapeHtml(formatDate(result.date)) + "</td>" +
            "<td>" + escapeHtml(result.name || "Tournament") + "</td>" +
            "<td>" + escapeHtml(teamText(result.team)) + "</td>" +
            "<td>" + escapeHtml(result.bracket || "-") + "</td>" +
            "<td>" + escapeHtml(result.points || 0) + "</td>" +
            "<td>" + escapeHtml(result.finish || "-") + "</td>" +
            "<td>" + escapeHtml(result.total_teams || "-") + "</td>" +
            "</tr>";
        }).join("") + "</tbody></table></div>";
    }

    function filteredPlayers() {
      return allPlayers.filter(function (player) {
        var genderMatches = String(player.gender || "").toUpperCase() === selectedGender;
        var nameMatches = !searchTerm || String(player.name || "").toLowerCase().indexOf(searchTerm) !== -1;
        return genderMatches && nameMatches;
      });
    }

    function visiblePlayers() {
      return filteredPlayers().slice(0, maxVisiblePlayers);
    }

    function render() {
      var matchingPlayers = filteredPlayers();
      var players = matchingPlayers.slice(0, maxVisiblePlayers);
      rowsEl.innerHTML = players.map(playerRow).join("");
      countEl.textContent = selectedSeason + " " + genderLabel(selectedGender) + ": showing " + players.length + " of " + matchingPlayers.length + " player" + (matchingPlayers.length === 1 ? "" : "s");
      statusEl.hidden = true;
      tableWrap.hidden = false;

      if (!players.length) {
        statusEl.hidden = false;
        statusEl.textContent = searchTerm ? "No players match that search." : "No " + genderLabel(selectedGender).toLowerCase() + " standings are available.";
      }
    }

    function setGender(gender) {
      selectedGender = gender;
      expanded = {};
      filterButtons.forEach(function (button) {
        var active = button.getAttribute("data-gender-filter") === selectedGender;
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
      });
      render();
    }

    function togglePlayer(id) {
      expanded[id] = !expanded[id];
      render();
    }

    if (searchInput) {
      searchInput.addEventListener("input", function () {
        searchTerm = String(searchInput.value || "").trim().toLowerCase();
        expanded = {};
        render();
      });
    }

    filterButtons.forEach(function (button) {
      button.setAttribute("aria-pressed", button.classList.contains("is-active") ? "true" : "false");
      button.addEventListener("click", function () {
        setGender(button.getAttribute("data-gender-filter") || "M");
      });
    });

    function standingsUrl() {
      var separator = apiUrl.indexOf("?") === -1 ? "?" : "&";
      return apiUrl + separator + "season=" + encodeURIComponent(selectedSeason);
    }

    function loadStandings() {
      statusEl.hidden = false;
      statusEl.textContent = "Loading player points...";
      tableWrap.hidden = true;
      expanded = {};

      fetch(standingsUrl(), { credentials: "include" })
      .then(function (response) {
        if (!response.ok) throw new Error("Unable to load player points.");
        return response.json();
      })
      .then(function (payload) {
        allPlayers = normalizePlayers(payload).sort(function (a, b) {
          return Number(b.totalPoints || 0) - Number(a.totalPoints || 0) || String(a.name || "").localeCompare(String(b.name || ""));
        });

        if (!allPlayers.length) {
          statusEl.textContent = "No player points are available.";
          return;
        }

        render();

      })
      .catch(function (error) {
        statusEl.textContent = error.message || "Unable to load player points.";
      });
    }

    rowsEl.addEventListener("click", function (event) {
      var row = event.target.closest ? event.target.closest("[data-player-id]") : null;
      if (row) togglePlayer(row.getAttribute("data-player-id"));
    });
    rowsEl.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" && event.key !== " ") return;
      var row = event.target.closest ? event.target.closest("[data-player-id]") : null;
      if (!row) return;
      event.preventDefault();
      togglePlayer(row.getAttribute("data-player-id"));
    });
    if (seasonSelect) {
      seasonSelect.addEventListener("change", function () {
        selectedSeason = seasonSelect.value;
        loadStandings();
      });
    }

    loadStandings();
  })();
</script>
