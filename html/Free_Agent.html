<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

<!-- Loading Spinner -->
<div id="loading" style="display:flex; justify-content:center; align-items:center; height:100px; flex-direction:column;">
  <div class="spinner" style="
    border: 6px solid #f3f3f3;
    border-top: 6px solid #0052a5;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
  "></div>
  <div style="margin-top:10px; font-weight:bold; color:#0052a5;">Loading...</div>
</div>
<div id="filterNotice" style="
  display:none;
  margin: 8px 0 4px 0;
  padding: 8px 12px;
  border-left: 4px solid #0052a5;
  background:#f0f4f9;
  font-size: 0.95em;
  color:#0f2a44;
"></div>

<div style="overflow-x:auto; max-width:100%; margin:0 auto;">
  <table id="chrvaTable" class="display nowrap" style="width:100%; opacity:0; transition:opacity 0.8s ease; font-size:1.1em;">
    <thead><tr></tr></thead>
  </table>
</div>

<style>
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

#chrvaTable {
  padding-top: 10px !important;
}

/* Header styling */
#chrvaTable thead {
  display: table-header-group !important;
}
#chrvaTable thead th {
  background-color: #a0001e !important; /* CHRVA red */
  color: #fff !important;
  font-weight: bold !important;
  text-align: center !important;
  padding: 8px !important;
  border-bottom: 2px solid #fff !important;
}

/* Dropdown (responsive details) styling */
table.dataTable.dtr-inline.collapsed > tbody > tr.parent > td.control:before {
  background-color: #0052a5 !important; /* CHRVA blue for arrow */
}
.dtr-details {
  background-color: #f0f4f9 !important;
  padding: 8px 12px;
  border-left: 3px solid #0052a5;
  margin-top: 5px;
  font-size: 0.95em;
  color: #333;
}
.dtr-details p {
  margin: 4px 0;
}
</style>
<script>
  // --- URL param
  const getParam = (name) => new URLSearchParams(window.location.search).get(name);

  // --- Normalization helpers
  // Maps "women's" -> "womens", "men's" -> "mens" so tokens align with URL style.
  const normalize = (s) =>
    (s || "")
      .toString()
      .replace(/women['’]s/gi, "womens")
      .replace(/men['’]s/gi, "mens")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "");

  const humanize = (s) =>
    (s || "").toString().replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

  const escapeHtml = (s) =>
    (s || "")
      .toString()
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

// Parse gender out of event token. Returns 'men' | 'women' | null
const parseGenderFromToken = (token) => {
  const t = normalize(token || "");
  if (/(?:^|[_-])mens?$/i.test(t)) return "men";
  if (/(?:^|[_-])womens?$/i.test(t)) return "women";
  return null;
};

  // Remove trailing _mens/_womens (or -mens/-womens) to get the base event token
  const stripGenderFromToken = (token) =>
  (token || "").toString().replace(/[_-]?(?:mens?|women?s?)$/i, "");

  // Timestamp display
  const formatTimestamp = (isoString) => {
    if (!isoString) return "Not Provided";
    const date = new Date(isoString);
    return date.toLocaleString("en-US", {
      month: "long",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
    });
  };

  // Split multi-entry tournament cells:
  // e.g., "Sat, Nov 29th - Men's 6s Volley Banquet Bash @ NLCC, Sun, Nov 30th - Women's 6s Volley Banquet Bash @ NLCC"
  const splitTournamentItems = (val) => {
    if (!val) return [];
    return val
      .toString()
      .replace(/<br\s*\/?>/gi, "\n")
      .split(/\s*(?:\r?\n|;|\|)\s*/)
      .flatMap((chunk) => chunk.split(/,\s*(?=(?:Sun|Mon|Tue|Wed|Thu|Fri|Sat),?\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[\s-]+\d{1,2}(?:st|nd|rd|th)?\b)/i))
      .map((s) => s.trim().replace(/,+$/, "").trim())
      .filter(Boolean);
  };

  // Detect gender within a single line (supports Men’s/Men's, Women’s/Women's)
  const detectItemGender = (s) => {
    if (!s) return null;
    if (/\bmen['’]?s\b/i.test(s)) return "men";
    if (/\bwom(?:e|a)n['’]?s\b/i.test(s)) return "women";
    return null;
  };

  // Does a tournament line match the base event token? (check RHS after " - ")
  const itemMatchesEvent = (item, baseEventToken) => {
    if (!baseEventToken) return true;
    const parts = item.split(" - ");
    const rhs = parts[1] || item; // e.g., "Women's 6s Volley Banquet Bash @ North Laurel..."
    const rhsToken = normalize(rhs);
    return rhsToken.includes(normalize(baseEventToken));
  };

  // Keep the subset of lines that match event + gender (if provided)
  const filterTournamentItemsForEvent = (val, baseEventToken, gender) => {
    const items = splitTournamentItems(val);
    return items.filter((it) => {
      if (!itemMatchesEvent(it, baseEventToken)) return false;
      if (!gender) return true;
      const g = detectItemGender(it);
      return g === gender;
    });
  };

  // Render tournaments as multi-line HTML (optionally filtered by event+gender)
  const renderTournamentList = (val, type, baseEventToken = null, gender = null) => {
    const items = baseEventToken || gender
      ? filterTournamentItemsForEvent(val, baseEventToken, gender)
      : splitTournamentItems(val);

    if (!items.length) return type === "display" ? "Not Provided" : "";

    if (type === "display") {
      return items.map((x) => `<div>${escapeHtml(x)}</div>`).join("");
    }
    if (type === "filter" || type === "sort") {
      return items.join(" | ");
    }
    return val;
  };

  fetch("https://chrva-proxy.vercel.app/api/free-agents", { credentials: "include" })
    .then((res) => res.json())
    .then((rawData) => {
      if (!Array.isArray(rawData) || rawData.length === 0) {
        throw new Error("No data returned");
      }

      const TOURNAMENT_COL_LABEL = "Which Tournaments are you available for?";
      const keys = Object.keys(rawData[0]);
      const tournamentKey =
        keys.find((k) => k.trim() === TOURNAMENT_COL_LABEL) ||
        keys.find((k) => normalize(k) === normalize(TOURNAMENT_COL_LABEL));

      const timestampKey = "Timestamp";
      const eventParam = getParam("event"); // e.g. "volley_banquet_bash_womens"
      const genderFilter = parseGenderFromToken(eventParam); // 'women'
      const baseEventToken = eventParam ? stripGenderFromToken(eventParam) : null; // "volley_banquet_bash"

      // Filter notice
      if (eventParam) {
        const notice = document.getElementById("filterNotice");
        if (notice) {
          const prettyEvent = humanize(baseEventToken);
          const prettyGender = genderFilter ? ` (${genderFilter === "men" ? "Men’s" : "Women’s"})` : "";
          notice.innerHTML = `
            <strong>Filtered:</strong> Showing free agents available for <strong>${prettyEvent}${prettyGender}</strong>.
            <a href="./free-agents" style="margin-left:10px; text-decoration:underline;">Clear filter</a>
          `;
          notice.style.display = "block";
        }
      }

      // Row-level filtering: keep rows that have at least one matching line
      let data = rawData;
      if (eventParam && tournamentKey) {
        data = rawData.filter((row) => {
          const matches = filterTournamentItemsForEvent(row[tournamentKey], baseEventToken, genderFilter);
          return matches.length > 0;
        });
      }

      if (!data.length) {
        document.getElementById("loading").innerHTML =
          '<span style="color:#0052a5;font-weight:bold;">No matching free agents for this event yet.</span>';
        return;
      }

      // Build base columns (excluding timestamp + tournament for now)
      const baseDataCols = keys
        .filter((k) => k !== timestampKey && k !== tournamentKey)
        .map((k) => ({
          title: k,
          data: k,
          responsivePriority: k === "Name" ? 1 : 2,
        }));

      // Timestamp column
      const timestampCol = {
        title: timestampKey,
        data: timestampKey,
        visible: true,
        render: (d) => formatTimestamp(d),
      };

      // Tournament column LAST; visible only when NOT filtering (but included in responsive dropdown when hidden)
      const tournamentCol = tournamentKey
        ? {
            title: tournamentKey,
            data: tournamentKey,
            visible: !eventParam, // hide when filter is active
            render: (data, type) => renderTournamentList(data, type, baseEventToken, genderFilter),
          }
        : null;

      const columns = [
        {
          className: "control",
          title: "",
          orderable: false,
          sortable: false,
          data: null,
          defaultContent: "",
          responsivePriority: 1,
        },
        ...baseDataCols,
        timestampCol,
        ...(tournamentCol ? [tournamentCol] : []), // ensure LAST position
      ];

      // Build table header to match visible columns
      const theadRow = document.querySelector("#chrvaTable thead tr");
      theadRow.innerHTML = "";
      columns.forEach((col) => {
        if (col.visible !== false) {
          const th = document.createElement("th");
          th.textContent = col.title || "";
          theadRow.appendChild(th);
        }
      });

      // Hide Preferred Position columns 
      if (genderFilter) {
        columns.forEach(col => {
          if (col.title && /Preferred Fours Position/i.test(col.title)) col.visible = false;
        });
      }

      // Init DataTable
      $('#chrvaTable').DataTable({
        data,
        columns,
        paging: true,
        searching: true,
        ordering: true,
        responsive: {
          details: {
            type: "column",
            target: "td.control",
            renderer: function (api, rowIdx, cols) {
              const rowData = api.row(rowIdx).data();
              return (
                cols
                  .filter((c) => c.hidden)
                  .map(
                    (c) => {
                      const isTournamentColumn = tournamentKey && c.title === tournamentKey;
                      const value = isTournamentColumn
                        ? renderTournamentList(rowData[tournamentKey], "display", baseEventToken, genderFilter)
                        : ((c.data !== undefined && c.data !== null && c.data !== "")
                          ? escapeHtml(c.data)
                          : "Not Provided");
                      return `<p><strong>${escapeHtml(c.title)}:</strong> ${value}</p>`;
                    }
                  )
                  .join("") || "No additional info"
              );
            },
          },
        },
        scrollX: false,
        autoWidth: false,
        language: {
          emptyTable: eventParam
            ? "No free agents match the selected event."
            : "No data available.",
        },
      });

      // Hide spinner and fade in
      document.getElementById("loading").style.display = "none";
      const table = document.getElementById("chrvaTable");
      table.style.display = "table";
      setTimeout(() => (table.style.opacity = "1"), 50);
    })
    .catch((err) => {
      document.getElementById("loading").innerHTML =
        '<span style="color:red;">Failed to load data.</span>';
      console.error("Error loading data:", err);
    });
</script>
